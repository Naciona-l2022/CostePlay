      const seen = new Map();
      arr.forEach((item, idx) => {
        const clean = sanitizer(item, idx);
        if (clean) seen.set(clean.id, clean);
      });
      return Array.from(seen.values());

    const diffCollection = (path, prevList, nextList, updates) => {
      const prevMap = listToMap(prevList);
      const nextMap = listToMap(nextList);
      Object.keys(prevMap).forEach(id => { if (!nextMap[id]) updates[`${path}/${id}`] = null; });
      Object.keys(nextMap).forEach(id => { if (!prevMap[id] || !sameItem(prevMap[id], nextMap[id])) updates[`${path}/${id}`] = nextMap[id]; });
      return updates;

    const copyToClipboard = async (text) => {
      const value = String(text || '');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
          return true;
        }
      } catch {}
      try {
        const ta = document.createElement('textarea');
        ta.value = value;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch { return false; }

      a.href = url;

      return `${y}-${String(m0 + 1).padStart(2, '0')}-${String(clampedDay).padStart(2, '0')}`;

    const getNextMonthSameDay = (currentDueDateStr, billingDay) => {
      const today = new Date();
      let y = today.getFullYear();
      let m = today.getMonth() + 1;
      let d = Number(billingDay) || today.getDate();

      if (currentDueDateStr && typeof currentDueDateStr === 'string') {
        const parts = currentDueDateStr.split('-').map(Number);
        if (parts.length === 3 && parts[0] > 2000) {
          y = parts[0];
          m = parts[1];
          if (!billingDay) d = parts[2];
        }
      }

      let nextMonth = m + 1;
      let nextYear = y;
      if (nextMonth > 12) {
        nextMonth = 1;
        nextYear += 1;
      }

      const maxDays = new Date(nextYear, nextMonth, 0).getDate();
      const finalDay = Math.max(1, Math.min(d || 1, maxDays));
      return `${nextYear}-${String(nextMonth).padStart(2, '0')}-${String(finalDay).padStart(2, '0')}`;
    };

    // Huella de los datos para no repetir copias idénticas
    const hashData = (data) => {
      const sortById = (list) => [...(list || [])].sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
      const str = JSON.stringify([sortById(data.clients), sortById(data.mothers), data.reminderTemplate || '']);
      let h1 = 5381, h2 = 52711;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = (h1 * 33) ^ ch;
        h2 = (h2 * 33) ^ ch;
      }
      return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36) + '_' + str.length;
    };

    function App() {
      // ---------- AUTENTICACIÓN CON GOOGLE ----------
      const [fbReady, setFbReady] = useState(false);
      const [fbInitError, setFbInitError] = useState('');
      const [authUser, setAuthUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const [signingIn, setSigningIn] = useState(false);

      const [hideMoney, setHideMoney] = useState(false);
      const [showFinanceBreakdown, setShowFinanceBreakdown] = useState(false);
      const [isCostModalOpen, setIsCostModalOpen] = useState(false);

      // ---------- DATOS (solo en la nube, ligados a la cuenta de Google) ----------
      const [clients, setClients] = useState([]);
      const [mothers, setMothers] = useState([]);
      const [reminderTemplate, setReminderTemplate] = useState(DEFAULT_REMINDER_TEMPLATE);
      const [serverLoaded, setServerLoaded] = useState(false);
      const [slowLoading, setSlowLoading] = useState(false);
      const [autoLoading, setAutoLoading] = useState(false);
      const [infoMessage, setInfoMessage] = useState('');
      const autoLoadDoneRef = useRef(false);

      const [cloudStatus, setCloudStatus] = useState('CONNECTING'); // CONNECTING | CONNECTED | OFFLINE | ERROR
      const [cloudError, setCloudError] = useState('');
      const [saveIndicator, setSaveIndicator] = useState('IDLE');
      const [lastSavedTime, setLastSavedTime] = useState('');
      const [pendingCount, setPendingCount] = useState(0);
      const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);

      // ---------- COPIAS DE SEGURIDAD ----------
      const [backups, setBackups] = useState([]);
      const [backupsLoaded, setBackupsLoaded] = useState(false);
      const [backupBusy, setBackupBusy] = useState(false);
      const [backupMessage, setBackupMessage] = useState('');

      const userRefRef = useRef(null);
      const uidRef = useRef(null);
      const pendingRef = useRef(0);
      const backupsRef = useRef([]);
      const backupBusyRef = useRef(false);
      const stateRef = useRef({ clients: [], mothers: [], reminderTemplate: DEFAULT_REMINDER_TEMPLATE });

      // Inicializa Firebase + escucha la sesión de Google
      useEffect(() => {
        cleanupOldBrowserData();
        if (!window.firebase || !window.firebase.auth || !window.firebase.database) {
          setFbInitError('No se pudo cargar Firebase. Revisa tu conexión a internet y recarga la página.');
          setAuthLoading(false);
          return;
        }
        let unsubscribe = () => {};
        try {
          const app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(FIREBASE_CONFIG);
          const auth = window.firebase.auth(app);
          auth.useDeviceLanguage();
          auth.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
          auth.getRedirectResult().catch((err) => setAuthError(authErrorMessage(err)));
          unsubscribe = auth.onAuthStateChanged((user) => {
            setAuthUser(user || null);
            setAuthLoading(false);
            setSigningIn(false);
          });
          setFbReady(true);
        } catch (err) {
          setFbInitError(err.message || 'Error iniciando Firebase');
          setAuthLoading(false);
        }
        return () => unsubscribe();
      }, []);

      const signInWithGoogle = async () => {
        setAuthError('');
        if (window.location.protocol === 'file:') {
          setAuthError(authErrorMessage({ code: 'auth/operation-not-supported-in-this-environment' }));
          return;
        }
        setSigningIn(true);
        const auth = window.firebase.auth();
        const provider = new window.firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await auth.signInWithPopup(provider);
        } catch (err) {
          if (err && (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment')) {
            try { await auth.signInWithRedirect(provider); return; } catch (err2) { setAuthError(authErrorMessage(err2)); }
          } else {
            setAuthError(authErrorMessage(err));
          }
          setSigningIn(false);
        }
      };

      const signOut = async () => {
        if (pendingRef.current > 0 && !window.confirm('Hay cambios que todavía se están subiendo a la nube. Si cierras sesión ahora se pueden perder. ¿Cerrar sesión de todas formas?')) return;
        try { await window.firebase.auth().signOut(); } catch {}
      };

      // ---------- GUARDADO EN LA NUBE ----------
      const changePending = (delta) => {
        pendingRef.current = Math.max(0, pendingRef.current + delta);
        setPendingCount(pendingRef.current);
      };

      const pushUpdates = (updates) => {
        const ref = userRefRef.current;
        const uid = uidRef.current;
        if (!ref || !uid || Object.keys(updates).length === 0) return;
        updates['meta/updatedAt'] = window.firebase.database.ServerValue.TIMESTAMP;
        changePending(1);
        setSaveIndicator('SAVING');
        // Firebase aplica el cambio al instante en pantalla y lo sube en cuanto hay internet
        ref.update(updates)
          .then(() => {
            if (uidRef.current !== uid) return;
            changePending(-1);
            setCloudStatus(prev => (prev === 'ERROR' ? 'CONNECTED' : prev));
            if (pendingRef.current === 0) {
              setSaveIndicator('SAVED');
              setLastSavedTime(nowTimeLabel());
              setCloudError('');
            }
          })
          .catch((err) => {
            if (uidRef.current !== uid) return;
            changePending(-1);
            const denied = String((err && (err.code || err.message)) || '').toUpperCase().includes('PERMISSION');
            setSaveIndicator('ERROR');
            setCloudError(denied
              ? 'Firebase rechazó el guardado (permiso denegado). Revisa las Reglas de la base de datos (ver "Estado de la Nube").'
              : ((err && err.message) || 'Error al guardar en Firebase'));
          });
      };

      // Aplica un nuevo estado y sube SOLO las diferencias
      const commit = (nextClients, nextMothers, nextTemplate, extraUpdates) => {
        const prev = stateRef.current;
        const next = {
          clients: nextClients ? sanitizeClientList(nextClients) : prev.clients,
          mothers: nextMothers ? sanitizeMotherList(nextMothers) : prev.mothers,
          reminderTemplate: typeof nextTemplate === 'string' ? nextTemplate : prev.reminderTemplate
        };
        const updates = { ...(extraUpdates || {}) };
        if (nextClients) diffCollection('clients', prev.clients, next.clients, updates);
        if (nextMothers) diffCollection('mothers', prev.mothers, next.mothers, updates);
        if (next.reminderTemplate !== prev.reminderTemplate) updates['settings/reminderTemplate'] = next.reminderTemplate;

        stateRef.current = next;
        setClients(next.clients);
        setMothers(next.mothers);
        setReminderTemplate(next.reminderTemplate);
        pushUpdates(updates);
      };

      const syncClientsWithMothers = (clientList, motherList) => clientList.map(c => {
        const cleanEmail = (c.accountEmail || '').trim().toLowerCase();
        const matchedMother = motherList.find(m => (m.email || '').trim().toLowerCase() === cleanEmail);
        return matchedMother ? { ...c, platform: matchedMother.platform, accountEmail: matchedMother.email.trim() } : c;
      });

      const updateClients = (updater) => {
        const current = stateRef.current;
        const rawNext = typeof updater === 'function' ? updater(current.clients) : updater;
        commit(syncClientsWithMothers(sanitizeClientList(rawNext), current.mothers), null);
      };

      const updateMothers = (updater, clientsUpdater) => {
        const current = stateRef.current;
        const rawNext = typeof updater === 'function' ? updater(current.mothers) : updater;
        const cleanMothers = sanitizeMotherList(rawNext);
        const baseClients = clientsUpdater ? clientsUpdater(current.clients) : current.clients;
        commit(syncClientsWithMothers(sanitizeClientList(baseClients), cleanMothers), cleanMothers);
      };

      const updateTemplate = (newTemp) => commit(null, null, String(newTemp || DEFAULT_REMINDER_TEMPLATE));

      // Reemplaza TODO (importar respaldo / restaurar copia / migrar datos antiguos)
      const replaceAllData = (c, m, t) => {
        const cleanM = sanitizeMotherList(m);
        const cleanC = syncClientsWithMothers(sanitizeClientList(c), cleanM);
        commit(cleanC, cleanM, String(t || stateRef.current.reminderTemplate || DEFAULT_REMINDER_TEMPLATE), { 'meta/migrated': true });
      };

      // ---------- COPIAS DE SEGURIDAD EN LA CUENTA DE GOOGLE ----------
      // Se guardan en Firebase en backups/{uid} (datos) y backupsIndex/{uid} (lista liviana)
      const createBackup = async (type, note = '') => {
        const uid = uidRef.current;
        if (!uid || backupBusyRef.current) return false;
        const cur = stateRef.current;
        if (cur.clients.length === 0 && cur.mothers.length === 0) {
          if (type === 'manual') setBackupMessage('No hay datos para copiar todavía.');
          return false;
        }
        backupBusyRef.current = true;
        setBackupBusy(true);
        try {
          const id = (type === 'auto' ? 'a_' : 'm_') + Date.now();
          const updates = {};
          updates[`backups/${uid}/${id}`] = {
            clients: listToMap(cur.clients),
            mothers: listToMap(cur.mothers),
            reminderTemplate: cur.reminderTemplate
          };
          updates[`backupsIndex/${uid}/${id}`] = {
            createdAt: window.firebase.database.ServerValue.TIMESTAMP,
            type,
            note: String(note || ''),
            clients: cur.clients.length,
            mothers: cur.mothers.length,
            hash: hashData(cur)
          };
          // Borra las copias más viejas para no llenar la base de datos
          const keep = type === 'auto' ? AUTO_BACKUPS_TO_KEEP : MANUAL_BACKUPS_TO_KEEP;
          const sameType = backupsRef.current.filter(b => b.type === type).sort((a, b) => a.createdAt - b.createdAt);
          const excess = sameType.length + 1 - keep;
          for (let k = 0; k < excess; k++) {
            updates[`backups/${uid}/${sameType[k].id}`] = null;
            updates[`backupsIndex/${uid}/${sameType[k].id}`] = null;
          }
          await window.firebase.database().ref().update(updates);
          if (type === 'manual') setBackupMessage(`✅ Copia creada (${cur.clients.length} clientes, ${cur.mothers.length} cuentas).`);
          return true;
        } catch (err) {
          setBackupMessage('⚠️ No se pudo crear la copia: ' + ((err && err.message) || 'error desconocido'));
          return false;
        } finally {
          backupBusyRef.current = false;
          setBackupBusy(false);
        }
      };

      const loadBackupData = async (id) => {
        const snap = await window.firebase.database().ref(`backups/${uidRef.current}/${id}`).once('value');
        const d = snap.val();
        if (!d) throw new Error('La copia ya no existe.');
        return {
          clients: sanitizeClientList(d.clients),
          mothers: sanitizeMotherList(d.mothers),
          reminderTemplate: typeof d.reminderTemplate === 'string' ? d.reminderTemplate : ''
        };
      };

      const restoreBackup = async (b) => {
        const cur = stateRef.current;
        if (!window.confirm(`¿Restaurar la copia del ${formatDateTime(b.createdAt)} (${b.clients} clientes, ${b.mothers} cuentas)?\n\nTus datos actuales (${cur.clients.length} clientes, ${cur.mothers.length} cuentas) se guardarán antes en una copia manual "Antes de restaurar", por si quieres volver.`)) return;
        try {
          const data = await loadBackupData(b.id);
          const hasCurrent = cur.clients.length > 0 || cur.mothers.length > 0;
          if (hasCurrent && !(await createBackup('manual', 'Antes de restaurar')) &&
              !window.confirm('No se pudo guardar la copia previa de tus datos actuales. ¿Restaurar de todos modos?')) return;
          replaceAllData(data.clients, data.mothers, data.reminderTemplate);
          setBackupMessage(`✅ Copia del ${formatDateTime(b.createdAt)} restaurada.`);
        } catch (err) {
          setBackupMessage('⚠️ No se pudo restaurar: ' + ((err && err.message) || 'error'));
        }
      };

      const downloadCloudBackup = async (b) => {
        try {
          const data = await loadBackupData(b.id);
          downloadJSON({
            app: 'CostePlay VIP',
            backupOf: new Date(b.createdAt).toISOString(),
            account: authUser ? authUser.email : '',
            ...data
          }, `Respaldo_CostePlay_${new Date(b.createdAt).toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`);
        } catch (err) {
          setBackupMessage('⚠️ No se pudo descargar: ' + ((err && err.message) || 'error'));
        }
      };

      const deleteBackup = async (b) => {
        if (!window.confirm(`¿Borrar la copia del ${formatDateTime(b.createdAt)}? No se puede deshacer.`)) return;
        const uid = uidRef.current;
        try {
          await window.firebase.database().ref().update({ [`backups/${uid}/${b.id}`]: null, [`backupsIndex/${uid}/${b.id}`]: null });
        } catch (err) {
          setBackupMessage('⚠️ No se pudo borrar: ' + ((err && err.message) || 'error'));
        }
      };

      // ---------- SINCRONIZACIÓN EN VIVO CON LA CUENTA DE GOOGLE ----------
      useEffect(() => {
        if (!fbReady || !authUser || !isAllowedUser(authUser)) {
          userRefRef.current = null;
          uidRef.current = null;
          pendingRef.current = 0;
          backupsRef.current = [];
          stateRef.current = { clients: [], mothers: [], reminderTemplate: DEFAULT_REMINDER_TEMPLATE };
          setClients([]); setMothers([]); setReminderTemplate(DEFAULT_REMINDER_TEMPLATE);
          setServerLoaded(false); setSlowLoading(false); setAutoLoading(false); setInfoMessage('');
          autoLoadDoneRef.current = false;
          setPendingCount(0); setSaveIndicator('IDLE'); setLastSavedTime('');
          setBackups([]); setBackupsLoaded(false); setBackupMessage('');
          return;
        }

        const uid = authUser.uid;
        const db = window.firebase.database();
        const ref = db.ref('users/' + uid);
        userRefRef.current = ref;
        uidRef.current = uid;
        setCloudStatus('CONNECTING');
        setCloudError('');

        ref.child('profile').update({
          email: authUser.email || '',
          name: authUser.displayName || '',
          lastLogin: window.firebase.database.ServerValue.TIMESTAMP
        }).catch(() => {});

        // Primera vez con la cuenta vacía: trae sola la ÚLTIMA versión guardada
        // 1) la copia de seguridad más reciente de esta cuenta, 2) si no hay, los datos anteriores
        const autoLoadLatest = async () => {
          autoLoadDoneRef.current = true;
          setAutoLoading(true);
          try {
            const idxSnap = await db.ref('backupsIndex/' + uid).once('value');
            const idx = idxSnap.val() || {};
            const latest = Object.entries(idx)
              .map(([id, b]) => ({ id, createdAt: Number(b && b.createdAt) || 0 }))
              .sort((a, b) => b.createdAt - a.createdAt)[0];
            if (latest) {
              const bSnap = await db.ref(`backups/${uid}/${latest.id}`).once('value');
              const d = bSnap.val();
              if (d) {
                replaceAllData(d.clients, d.mothers, d.reminderTemplate);
                setInfoMessage(`✅ Se cargó tu última versión guardada (${formatDateTime(latest.createdAt)}).`);
                return;
              }
            }
            let legacy = null;
            try {
              legacy = (await db.ref(LEGACY_DATA_PATH).once('value')).val();
            } catch (err) {
              // Sin permiso todavía (reglas sin publicar): no se marca nada, se reintenta al volver a entrar
              autoLoadDoneRef.current = false;
              setInfoMessage('⚠️ No se pudieron leer tus datos anteriores (permiso denegado). Publica las reglas nuevas (botón de la nube → "Copiar reglas") y vuelve a entrar.');
              return;
            }
            if (legacy && (legacy.clients || legacy.mothers)) {
              replaceAllData(legacy.clients, legacy.mothers, legacy.reminderTemplate);
              setInfoMessage('✅ Se cargaron tus datos guardados en la nube.');
              return;
            }
            commit(null, null, null, { 'meta/migrated': true });
          } catch (err) {
            setInfoMessage('⚠️ No se pudieron cargar tus datos guardados: ' + ((err && err.message) || 'error') + '. Puedes cargar un respaldo en "💾 Copias".');
          } finally {
            setAutoLoading(false);
          }
        };

        const handleValue = (snapshot) => {
          const data = snapshot.val() || {};
          const c = sanitizeClientList(data.clients);
          const m = sanitizeMotherList(data.mothers);
          const t = (data.settings && typeof data.settings.reminderTemplate === 'string' && data.settings.reminderTemplate) || DEFAULT_REMINDER_TEMPLATE;
          stateRef.current = { clients: c, mothers: m, reminderTemplate: t };
          setClients(c); setMothers(m); setReminderTemplate(t);
          setServerLoaded(true);
          setCloudStatus(prev => (prev === 'ERROR' ? 'CONNECTED' : prev));
          if (c.length === 0 && m.length === 0 && !(data.meta && data.meta.migrated) && !autoLoadDoneRef.current) {
            autoLoadLatest();
          }
        };
        const handleError = (err) => {
          setCloudStatus('ERROR');
          setCloudError((err && err.message) || 'No se pudo leer la base de datos. Revisa las Reglas de Firebase.');
        };
        ref.on('value', handleValue, handleError);

        const idxRef = db.ref('backupsIndex/' + uid);
        const handleIndex = (snap) => {
          const raw = snap.val() || {};
          const list = Object.entries(raw)
            .map(([id, b]) => ({ id, ...(b || {}), createdAt: Number(b && b.createdAt) || 0 }))
            .sort((a, b) => b.createdAt - a.createdAt);
          backupsRef.current = list;
          setBackups(list);
          setBackupsLoaded(true);
        };
        idxRef.on('value', handleIndex, () => setBackupsLoaded(true));

        const connRef = db.ref('.info/connected');
        const handleConn = (snap) => setCloudStatus(prev => (snap.val() === true ? (prev === 'ERROR' ? 'ERROR' : 'CONNECTED') : (prev === 'ERROR' ? 'ERROR' : 'OFFLINE')));
        connRef.on('value', handleConn);

        const slowTimer = setTimeout(() => setSlowLoading(true), 8000);

        return () => {
          clearTimeout(slowTimer);
          ref.off('value', handleValue);
          idxRef.off('value', handleIndex);
          connRef.off('value', handleConn);
        };
      }, [fbReady, authUser]);

      // Copia automática: revisa cada minuto; crea una si pasaron 10 min y los datos cambiaron
      useEffect(() => {
        if (!authUser || !serverLoaded || !backupsLoaded) return;
        const tick = () => {
          const cur = stateRef.current;
          if (cur.clients.length === 0 && cur.mothers.length === 0) return;
          const list = backupsRef.current;
          const lastAuto = list.find(b => b.type === 'auto');
          if (lastAuto && Date.now() - lastAuto.createdAt < AUTO_BACKUP_EVERY_MS) return;
          if (list[0] && list[0].hash === hashData(cur)) return; // nada cambió desde la última copia
          createBackup('auto');
        };
        const first = setTimeout(tick, 15000);
        const interval = setInterval(tick, 60000);
        return () => { clearTimeout(first); clearInterval(interval); };
      }, [authUser, serverLoaded, backupsLoaded]);

      // Avisa antes de cerrar la pestaña si hay cambios subiéndose
      useEffect(() => {
        const handler = (e) => {
          if (pendingRef.current > 0) { e.preventDefault(); e.returnValue = ''; }
        };
        window.addEventListener('beforeunload', handler);
        return () => window.removeEventListener('beforeunload', handler);
      }, []);

      const [selectedPlatform, setSelectedPlatform] = useState('ALL');
      const [activeTab, setActiveTab] = useState('CLIENTS');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [motherFilter, setMotherFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [copiedId, setCopiedId] = useState(null);

      const [isClientModalOpen, setIsClientModalOpen] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      const [prefilledSlot, setPrefilledSlot] = useState(null);
      const [isMotherModalOpen, setIsMotherModalOpen] = useState(false);
      const [editingMother, setEditingMother] = useState(null);
      const [isBulkMotherModalOpen, setIsBulkMotherModalOpen] = useState(false);
      const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);
      const [isAccountModalOpen, setIsAccountModalOpen] = useState(false);
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);

      const getDaysDiff = (dateStr) => {
        if (!dateStr || typeof dateStr !== 'string') return 0;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(dateStr + 'T00:00:00');
        if (isNaN(target.getTime())) return 0;
        return Math.round((target - today) / (1000 * 60 * 60 * 24));
      };

      const parseNum = (val) => Number(String(val || '').replace(/\D/g, '')) || 0;

      const formatCurrency = (val) => {
        const num = parseNum(val);
        return num.toLocaleString('es-CO');
      };

      const formatMoneyDisplay = (val) => {
        if (hideMoney) return '••••••';
        const num = Number(val) || 0;
        const prefix = num < 0 ? '-$' : '$';
        return prefix + Math.abs(num).toLocaleString('es-CO');
      };

      const formatDateEs = (dateStr) => {
        if (!dateStr || typeof dateStr !== 'string') return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const [y, m, d] = parts;
        const mIdx = (parseInt(m, 10) || 1) - 1;
        return `${parseInt(d, 10) || 1} ${MONTHS_ES[mIdx] || 'ene'} ${y}`;
      };

      const copyText = async (text, id) => {
        const ok = await copyToClipboard(text);
        if (!ok) { window.prompt('Copia el texto manualmente:', String(text || '')); return; }
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 1800);
      };

      const buildReminderMessage = (client) => {
        const platObj = PLATFORMS.find(p => p.id === client.platform);
        const platNameUpper = (platObj ? platObj.name : client.platform).toUpperCase();
        const fixedDay = client.billingDay || 10;

        // Se usan funciones de reemplazo para que caracteres como "$" en los datos no rompan el mensaje
        const values = {
          cliente: client.name || '',
          plataforma: platNameUpper,
          correo: client.accountEmail || '',
          perfil: client.profileName || 'Asignado',
          pin: client.pin || 'Sin PIN',
          vencimiento: formatDateEs(client.dueDate),
          dia_corte: `día ${fixedDay}`,
          valor: formatCurrency(client.price)
        };
        return String(reminderTemplate || DEFAULT_REMINDER_TEMPLATE)
          .replace(/\{(cliente|plataforma|correo|perfil|pin|vencimiento|dia_corte|valor)\}/g, (_, key) => values[key]);
      };

      const sendWhatsAppReminder = (client) => {
        const msg = buildReminderMessage(client);
        const cleanPhone = normalizePhoneForWhatsApp(client.phone);
        if (cleanPhone.length < 10) {
          alert(`El número de WhatsApp de ${client.name} no es válido. Edítalo e incluye el indicativo (57...).`);
          return;
        }
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
      };

      const markMonthPaid = (client) => {
        const fixedDay = client.billingDay || 10;
        const nextDate = getNextMonthSameDay(client.dueDate, fixedDay);
        updateClients(prev => prev.map(c => c.id === client.id ? { ...c, billingDay: fixedDay, dueDate: nextDate } : c));
      };

      const markMotherRenewed = (mother) => {
        const fixedDay = mother.billingDay || 15;
        const nextDate = getNextMonthSameDay(mother.renewalDate, fixedDay);
        updateMothers(prev => prev.map(m => m.id === mother.id ? { ...m, billingDay: fixedDay, renewalDate: nextDate } : m));
      };

      // --- MOTOR FINANCIERO VIP (CAJA REGISTRADORA EN VIVO) ---
      const stats = useMemo(() => {
        const baseClients = selectedPlatform === 'ALL' ? clients : clients.filter(c => c.platform === selectedPlatform);
        const baseMothers = selectedPlatform === 'ALL' ? mothers : mothers.filter(m => m.platform === selectedPlatform);

        let active = 0, expiring = 0, expired = 0, codeIssues = 0;
        let totalMonthlyCOP = 0, collectedCOP = 0, expiredMoneyCOP = 0, expiringMoneyCOP = 0;

        baseClients.forEach(c => {
          const days = getDaysDiff(c.dueDate);
          const priceNum = parseNum(c.price);
          totalMonthlyCOP += priceNum;

          if (days < 0) {
            expired++;
            expiredMoneyCOP += priceNum;
          } else if (days <= 3) {
            expiring++;
            expiringMoneyCOP += priceNum;
          } else {
            active++;
            collectedCOP += priceNum;
          }

          if (c.codeStatus !== 'OK') codeIssues++;
        });

        let totalFreeSlots = 0, accountsWithSpace = 0, fullAccounts = 0, totalMotherCostCOP = 0;

        baseMothers.forEach(m => {
          const cleanM = String(m.email || '').trim().toLowerCase();
          const used = clients.filter(c => String(c.accountEmail || '').trim().toLowerCase() === cleanM).length;
          const free = Math.max(0, (Number(m.maxProfiles) || 5) - used);
          totalFreeSlots += free;
          if (free > 0) accountsWithSpace++;
          else fullAccounts++;

          totalMotherCostCOP += parseNum(m.cost);
        });

        const netProfitCOP = totalMonthlyCOP - totalMotherCostCOP;
        const avgTicket = baseClients.length > 0 ? Math.round(totalMonthlyCOP / baseClients.length) : 15000;
        const potentialExtraCOP = totalFreeSlots * avgTicket;

        const platformBreakdown = PLATFORMS.filter(p => p.id !== 'ALL').map(p => {
          const pClients = clients.filter(c => c.platform === p.id);
          const pMothers = mothers.filter(m => m.platform === p.id);
          const revenue = pClients.reduce((acc, c) => acc + parseNum(c.price), 0);
          const cost = pMothers.reduce((acc, m) => acc + parseNum(m.cost), 0);
          const overdue = pClients.filter(c => getDaysDiff(c.dueDate) < 0).reduce((acc, c) => acc + parseNum(c.price), 0);
          return {
            ...p,
            clientCount: pClients.length,
            motherCount: pMothers.length,
            revenue,
            cost,
            profit: revenue - cost,
            overdue
          };
        }).filter(p => p.clientCount > 0 || p.motherCount > 0);

        return {
          active, expiring, expired, codeIssues,
          totalMonthlyCOP, collectedCOP, expiredMoneyCOP, expiringMoneyCOP,
          totalMotherCostCOP, netProfitCOP, potentialExtraCOP,
          totalClients: baseClients.length,
          totalMothers: baseMothers.length,
          totalFreeSlots, accountsWithSpace, fullAccounts,
          platformBreakdown
        };
      }, [clients, mothers, selectedPlatform]);

      const filteredClients = useMemo(() => {
        const q = String(searchQuery || '').toLowerCase();
        return clients
          .filter(c => selectedPlatform === 'ALL' || c.platform === selectedPlatform)
          .filter(c => {
            const days = getDaysDiff(c.dueDate);
            if (statusFilter === 'ACTIVE') return days > 3;
            if (statusFilter === 'EXPIRING') return days >= 0 && days <= 3;
            if (statusFilter === 'EXPIRED') return days < 0;
            if (statusFilter === 'CODE_ISSUE') return c.codeStatus !== 'OK';
            return true;
          })
          .filter(c => {
            return (
              String(c.name || '').toLowerCase().includes(q) ||
              String(c.accountEmail || '').toLowerCase().includes(q) ||
              String(c.phone || '').includes(q) ||
              String(c.pin || '').includes(q) ||
              String(c.billingDay || '').includes(q)
            );
          })
          .sort((a, b) => getDaysDiff(a.dueDate) - getDaysDiff(b.dueDate));
      }, [clients, selectedPlatform, statusFilter, searchQuery]);

      const filteredMothers = useMemo(() => {
        const q = String(searchQuery || '').toLowerCase();
        return mothers
          .filter(m => selectedPlatform === 'ALL' || m.platform === selectedPlatform)
          .filter(m => {
            const cleanM = String(m.email || '').trim().toLowerCase();
            const used = clients.filter(c => String(c.accountEmail || '').trim().toLowerCase() === cleanM).length;
            const isFull = used >= (Number(m.maxProfiles) || 5);
            if (motherFilter === 'AVAILABLE') return !isFull;
            if (motherFilter === 'FULL') return isFull;
            return true;
          })
          .filter(m => String(m.email || '').toLowerCase().includes(q));
      }, [mothers, clients, selectedPlatform, motherFilter, searchQuery]);

      // Descarga una copia a la PC (opcional, además de las copias en la nube)
      const downloadBackup = () => {
        const current = stateRef.current;
        downloadJSON({
          app: 'CostePlay VIP',
          exportedAt: new Date().toISOString(),
          account: authUser ? authUser.email : '',
          clients: current.clients,
          mothers: current.mothers,
          reminderTemplate: current.reminderTemplate
        }, `Respaldo_CostePlay_${todayISO()}.json`);
      };

      const readBackupFile = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            const hasClients = parsed && (Array.isArray(parsed.clients) || (parsed.clients && typeof parsed.clients === 'object'));
            const hasMothers = parsed && (Array.isArray(parsed.mothers) || (parsed.mothers && typeof parsed.mothers === 'object'));
            if (!hasClients && !hasMothers) throw new Error('El archivo no tiene clientes ni cuentas de CostePlay.');
            resolve({
              clients: sanitizeClientList(parsed.clients),
              mothers: sanitizeMotherList(parsed.mothers),
              reminderTemplate: typeof parsed.reminderTemplate === 'string' ? parsed.reminderTemplate : ''
            });
          } catch (err) { reject(err); }
        };
        reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
        reader.readAsText(file);
      });

      const importDataWithConfirm = async (data, sourceLabel) => {
        const current = stateRef.current;
        const hasCurrent = current.clients.length > 0 || current.mothers.length > 0;
        const msg = `${sourceLabel}: ${data.clients.length} clientes y ${data.mothers.length} cuentas madre.\n\n` +
          (hasCurrent
            ? `Esto REEMPLAZARÁ tus datos actuales (${current.clients.length} clientes y ${current.mothers.length} cuentas). Antes se guardará una copia de seguridad "Antes de importar" en tu cuenta.\n\n¿Continuar?`
            : '¿Cargar estos datos en tu cuenta?');
        if (!window.confirm(msg)) return false;
        if (hasCurrent && !(await createBackup('manual', 'Antes de importar')) &&
            !window.confirm('No se pudo guardar la copia previa de tus datos actuales. ¿Continuar de todos modos?')) return false;
        replaceAllData(data.clients, data.mothers, data.reminderTemplate || current.reminderTemplate);
        return true;
      };

      const handleImportBackup = async (e) => {
        const input = e.target;
        const file = input.files && input.files[0];
        input.value = ''; // permite volver a elegir el mismo archivo
        if (!file) return;
        try {
          const data = await readBackupFile(file);
          if (await importDataWithConfirm(data, `Archivo "${file.name}"`)) setBackupMessage(`✅ Datos de "${file.name}" cargados.`);
        } catch (err) {
          alert('Archivo inválido: ' + (err.message || 'formato desconocido'));
        }
      };

      // ---------- PANTALLAS DE ACCESO ----------
      if (fbInitError) {
        return (
          <AuthShell>
            <p className="text-sm text-red-300 font-semibold">⚠️ {fbInitError}</p>

      if (authLoading) {
        return (
          <AuthShell>

      if (!authUser) {
        const isFileProtocol = window.location.protocol === 'file:';
        return (

            <p className="text-sm text-zinc-300 mb-5">Inicia sesión con tu cuenta de Google. Tus clientes y cuentas se guardan solo en la nube, ligados a esa cuenta.</p>
            {isFileProtocol && (
              <div className="mb-4 text-left text-xs bg-amber-500/10 border border-amber-500/40 rounded-xl p-3 text-amber-200 leading-relaxed">

              </div>

            <p className="mt-5 text-[11px] text-zinc-500">Acceso solo para cuentas autorizadas.</p>

                    {saveIndicator === 'SAVED' && (

                    {saveIndicator === 'ERROR' && (
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-500/20 text-red-300 border border-red-500/40">
                        ⚠️ Error al subir
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-zinc-400 truncate max-w-[260px]" title={authUser.email || ''}>
                    {authUser.displayName || 'Panel Oficial'} • {authUser.email}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={() => setIsCloudModalOpen(true)}
                  className={`px-3 py-2 rounded-lg text-xs font-bold border cursor-pointer ${
                    cloudStatus === 'CONNECTED'
                      ? 'bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border-emerald-500/40'
                      : 'bg-amber-500 text-black border-amber-400 shadow-[0_0_15px_rgba(212,175,55,0.4)]'
                  }`}
                >
                  {cloudStatus === 'CONNECTED' ? '☁️ Nube Conectada' : '☁️ Estado de la Nube'}
                </button>
                <button
                  onClick={() => setIsTemplateModalOpen(true)}
                  className="px-3 py-2 rounded-lg text-xs font-semibold bg-zinc-900 hover:bg-zinc-800 text-amber-300 border border-zinc-800 cursor-pointer"
                >
                  💬 Mensaje Nequi
                </button>
                <button

                  className="px-3 py-2 rounded-lg text-xs font-semibold bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 cursor-pointer"
                  title={lastBackup ? `Última copia: ${formatDateTime(lastBackup.createdAt)}` : 'Aún no hay copias'}

                </button>
                <button
                  onClick={() => setIsAccountModalOpen(true)}
                  className="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 cursor-pointer"
                  title="Mi cuenta de Google"
                >
                  {authUser.photoURL
                    ? <img src={authUser.photoURL} alt="" referrerPolicy="no-referrer" className="w-6 h-6 rounded-full" />
                    : <span className="w-6 h-6 rounded-full bg-amber-500 text-black font-extrabold flex items-center justify-center">{(authUser.displayName || authUser.email || '?').charAt(0).toUpperCase()}</span>}
                  Mi cuenta
                </button>
                <button

                  Cerrar sesión
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 pt-6">
            {infoMessage && (
              <div className="mb-4 flex items-center justify-between gap-3 bg-emerald-500/10 border border-emerald-500/40 rounded-xl px-4 py-2.5 text-xs text-emerald-200">
                <span>{infoMessage}</span>
                <button onClick={() => setInfoMessage('')} className="text-zinc-400 hover:text-white cursor-pointer">✕</button>

            <div className="mb-6">
              <div className="flex items-center justify-between mb-2.5">

                  🎬 Filtra por Plataforma (Mostrando: {activePlatObj.name}):
                </p>
                {selectedPlatform !== 'ALL' && (
                  <button

                    className="text-xs font-bold text-amber-300 underline cursor-pointer"

                    Ver todas las plataformas ({clients.length} clientes)
                  </button>

              </div>

              <div className="flex items-center gap-2.5 overflow-x-auto pb-3">
                {PLATFORMS.map((plat) => {

                      className={`flex items-center gap-2.5 px-3.5 py-2 rounded-2xl text-xs font-bold whitespace-nowrap transition cursor-pointer border ${

                      <span>{plat.name}</span>
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isSelected ? 'bg-black/25 text-black' : 'bg-zinc-800 text-amber-300'}`}>
                        {clientCount}
                      </span>
                    </button>

              </div>
            </div>

            {/* RESUMEN FINANCIERO VIP */}
            <div className="mb-6 bg-gradient-to-br from-[#13110a] via-[#0e0e14] to-[#0a0a0f] border border-amber-500/35 rounded-2xl p-4 shadow-[0_0_30px_rgba(212,175,55,0.1)]">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <span className="text-xs font-extrabold uppercase tracking-wider bg-gradient-to-r from-[#FFF3B0] via-[#D4AF37] to-[#B38728] bg-clip-text text-transparent">
                  👑 Resumen Financiero VIP • Caja Registradora en Vivo ({activePlatObj.name})
                </span>

                <div className="flex items-center gap-2 flex-wrap">
                  <button
                    onClick={() => setIsCostModalOpen(true)}
                    className="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/40 cursor-pointer"
                  >
                    ⚙️ Configurar Costos de Cuentas Madre
                  </button>
                  <button
                    onClick={() => setShowFinanceBreakdown(!showFinanceBreakdown)}
                    className="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 cursor-pointer"
                  >
                    {showFinanceBreakdown ? '▲ Ocultar Desglose' : '📊 Ver Ganancia por Plataforma'}
                  </button>
                  <button
                    onClick={() => setHideMoney(!hideMoney)}
                    className="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-zinc-900 hover:bg-zinc-800 text-amber-300 border border-zinc-800 cursor-pointer"
                  >

                  </button>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

                      {stats.totalClients} perfiles

                  </p>

                  </p>
                </div>

                <div
                  onClick={() => { setActiveTab('CLIENTS'); setStatusFilter('EXPIRED'); }}
                  className={`rounded-xl p-3.5 border cursor-pointer transition ${
                    stats.expiredMoneyCOP > 0 ? 'bg-[#19070b] border-[#ff1744] shadow-[0_0_20px_rgba(255,23,68,0.28)]' : 'bg-[#09090d] border-zinc-800'

                >

    function ClientModal({ client, prefilled, mothers, onClose, onSave }) {
      const today = new Date();
      const defaultDay = client?.billingDay || (client?.dueDate ? Number(client.dueDate.split('-')[2]) : 10);

      const computeDateFromDay = (dayNum, mode) => {
        const y = today.getFullYear();
        const m = today.getMonth();
        if (mode === 'THIS_MONTH') return buildDateForDay(y, m, dayNum);
        const nextM = m + 1 > 11 ? 0 : m + 1;
        const nextY = m + 1 > 11 ? y + 1 : y;
        return buildDateForDay(nextY, nextM, dayNum);
      };

      const [form, setForm] = useState(
        client || {
          name: '',
          phone: '57',
          platform: prefilled?.platform || 'NETFLIX',
          accountEmail: prefilled?.accountEmail || mothers[0]?.email || '',
          profileName: prefilled?.profileName || 'Perfil 1',
          pin: '',
          billingDay: defaultDay,
          dueDate: computeDateFromDay(defaultDay, 'NEXT_MONTH'),
          price: '15000',
          isHouseholdHead: false,
          codeStatus: 'OK',
        }
      );

      const handleDayChange = (newDay) => {
        const dayNum = Math.max(1, Math.min(31, Number(newDay) || 1));
        const [y, m] = (isValidISODate(form.dueDate) ? form.dueDate : todayISO()).split('-').map(Number);
        const updatedDue = buildDateForDay(y, m - 1, dayNum);
        setForm({ ...form, billingDay: dayNum, dueDate: updatedDue });
      };

      const handleEmailChange = (newEmail) => {
        const clean = newEmail.trim().toLowerCase();
        const foundMother = mothers.find(m => (m.email || '').trim().toLowerCase() === clean);
        setForm({
          ...form,
          accountEmail: newEmail,
          platform: foundMother ? foundMother.platform : form.platform
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <form
            onSubmit={(e) => {
              e.preventDefault();
              const phoneDigits = String(form.phone || '').replace(/\D/g, '');
              if (phoneDigits.length < 10) { alert('El WhatsApp debe tener al menos 10 dígitos (ej. 573001234567).'); return; }
              const priceDigits = String(form.price || '').replace(/\D/g, '');
              if (!priceDigits) { alert('Escribe cuánto debe pagar el cliente (solo números).'); return; }
              if (!isValidISODate(form.dueDate)) { alert('La fecha de corte no es válida.'); return; }
              onSave({ ...form, name: String(form.name || '').trim(), phone: phoneDigits, price: priceDigits });
            }}
            className="bg-[#101015] border border-amber-500/40 rounded-2xl max-w-xl w-full p-6 space-y-4 my-8"
          >
            <h3 className="font-extrabold text-lg text-amber-400">
              {client ? 'Editar Cliente' : 'Registrar Cliente • CostePlay'}
            </h3>

            <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
              {PLATFORMS.filter(p => p.id !== 'ALL').map(p => (
                <button
                  type="button"
                  key={p.id}
                  onClick={() => setForm({ ...form, platform: p.id })}
                  className={`flex flex-col items-center gap-1 p-2 rounded-xl border text-[11px] font-bold cursor-pointer ${
                    form.platform === p.id ? 'bg-amber-500/20 border-amber-400 text-white' : 'bg-[#09090d] border-zinc-800 text-zinc-400'
                  }`}
                >
                  <PlatformLogo platformId={p.id} size={26} />
                  <span className="truncate w-full text-center">{p.name}</span>
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div>
                <label className="text-zinc-400 block mb-1">Nombre del Cliente *</label>
                <input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white" />
              </div>
              <div>
                <label className="text-zinc-400 block mb-1">WhatsApp (con 57) *</label>
                <input required inputMode="tel" placeholder="573001234567" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white" />
              </div>

              <div className="sm:col-span-2 bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 space-y-2">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <label className="text-amber-300 font-extrabold block text-xs">
                      📅 Día de Corte Fijo (Se repite todos los meses) *
                    </label>
                  </div>
                  <select
                    value={form.billingDay}
                    onChange={(e) => handleDayChange(e.target.value)}
                    className="bg-[#08080b] border border-amber-400 rounded-xl px-3 py-2 text-sm font-extrabold text-amber-300 cursor-pointer"
                  >
                    {Array.from({ length: 31 }, (_, i) => i + 1).map(day => (
                      <option key={day} value={day}>Todos los {day} de cada mes</option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setForm({ ...form, dueDate: computeDateFromDay(form.billingDay, 'NEXT_MONTH') })}
                    className="py-1.5 px-2 rounded-lg text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 cursor-pointer"
                  >
                    🟢 Ya pagó este mes (Corta el {form.billingDay} del otro mes)
                  </button>
                  <button
                    type="button"
                    onClick={() => setForm({ ...form, dueDate: computeDateFromDay(form.billingDay, 'THIS_MONTH') })}
                    className="py-1.5 px-2 rounded-lg text-[11px] font-bold bg-red-500/20 text-red-300 border border-red-500/40 cursor-pointer"
                  >
                    🔴 Debe este mes (Corta el {form.billingDay} de este mes)
                  </button>
                </div>
              </div>

              <div>
                <label className="text-zinc-400 block mb-1">Cuánto debe pagar ($) *</label>
                <input required inputMode="numeric" placeholder="Ej. 15000" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value.replace(/[^\d]/g, '') })} className="w-full bg-[#08080b] border border-amber-500/40 rounded-xl p-2.5 text-amber-300 font-bold" />
              </div>
              <div>
                <label className="text-zinc-400 block mb-1">Próxima fecha exacta de corte *</label>
                <input
                  type="date"
                  required
                  value={form.dueDate}
                  onChange={(e) => {
                    const newDate = e.target.value;
                    const dayPart = newDate ? Number(newDate.split('-')[2]) : form.billingDay;
                    setForm({ ...form, dueDate: newDate, billingDay: dayPart });
                  }}
                  className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white"
                />
              </div>

              <div className="sm:col-span-2">
                <label className="text-zinc-400 block mb-1">Correo de la Cuenta Asignada *</label>
                <input
                  required
                  list="mothers-datalist"
                  value={form.accountEmail}
                  onChange={(e) => handleEmailChange(e.target.value)}
                  className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white font-mono"
                />
                <datalist id="mothers-datalist">
                  {mothers.map(m => (
                    <option key={m.id} value={m.email}>{m.platform} — {m.email}</option>
                  ))}
                </datalist>
              </div>
              <div>
                <label className="text-zinc-400 block mb-1">Perfil asignado</label>
                <input value={form.profileName} onChange={(e) => setForm({ ...form, profileName: e.target.value })} className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white" />
              </div>
              <div>
                <label className="text-zinc-400 block mb-1">PIN del Perfil</label>
                <input value={form.pin} onChange={(e) => setForm({ ...form, pin: e.target.value })} className="w-full bg-[#08080b] border border-amber-500/40 rounded-xl p-2.5 text-amber-300 font-mono font-bold" />
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs bg-zinc-900 text-zinc-400 cursor-pointer">Cancelar</button>
              <button type="submit" className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-500 text-black cursor-pointer">Guardar Cliente</button>
            </div>
          </form>
        </div>
      );
    }

    function MotherModal({ mother, defaultPlatform, onClose, onSave }) {
      const defaultPlatObj = PLATFORMS.find(p => p.id === (defaultPlatform || 'NETFLIX')) || PLATFORMS[1];
      const [form, setForm] = useState(
        mother || {
          platform: defaultPlatObj.id,
          email: '',
          password: '',
          billingDay: new Date().getDate(),
          renewalDate: getNextMonthSameDay(todayISO(), new Date().getDate()),
          maxProfiles: defaultPlatObj.maxProfiles,
          cost: '',
        }
      );

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <form
            onSubmit={(e) => {
              e.preventDefault();
              const email = String(form.email || '').trim();
              if (!email) { alert('Escribe el correo de la cuenta.'); return; }
              const maxP = Number(form.maxProfiles);
              if (!maxP || maxP < 1 || maxP > 20) { alert('El total de perfiles debe estar entre 1 y 20.'); return; }
              if (!isValidISODate(form.renewalDate)) { alert('La fecha de corte no es válida.'); return; }
              onSave({ ...form, email, maxProfiles: maxP, cost: String(form.cost || '').replace(/\D/g, '') });
            }}
            className="bg-[#101015] border border-amber-500/40 rounded-2xl max-w-lg w-full p-6 space-y-4 text-xs my-8"
          >
            <h3 className="font-extrabold text-lg text-amber-400">{mother ? 'Editar Cuenta Madre' : 'Nueva Cuenta para Inventario'}</h3>
            <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
              {PLATFORMS.filter(p => p.id !== 'ALL').map(p => (
                <button
                  type="button"
                  key={p.id}
                  onClick={() => setForm({ ...form, platform: p.id, maxProfiles: p.maxProfiles })}
                  className={`flex flex-col items-center gap-1 p-2 rounded-xl border text-[11px] font-bold cursor-pointer ${
                    form.platform === p.id ? 'bg-amber-500/20 border-amber-400 text-white' : 'bg-[#09090d] border-zinc-800 text-zinc-400'
                  }`}
                >
                  <PlatformLogo platformId={p.id} size={26} />
                  <span className="truncate w-full text-center">{p.name}</span>
                </button>
              ))}
            </div>
            <div>
              <label className="text-zinc-400 block mb-1">Correo de la Cuenta *</label>
              <input required value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white font-mono" />
            </div>
            <div>
              <label className="text-zinc-400 block mb-1">Contraseña *</label>
              <input required value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white font-mono" />
            </div>
            <div className="grid grid-cols-3 gap-3">
              <div>
                <label className="text-zinc-400 block mb-1">Total Perfiles</label>
                <input type="number" min="1" max="20" value={form.maxProfiles} onChange={(e) => setForm({ ...form, maxProfiles: e.target.value === '' ? '' : Number(e.target.value) })} className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white" />
              </div>
              <div>
                <label className="text-amber-300 font-bold block mb-1">Costo Mensual ($)</label>
                <input
                  type="text"
                  placeholder="Ej. 38000"
                  inputMode="numeric"
                  value={form.cost || ''}
                  onChange={(e) => setForm({ ...form, cost: e.target.value.replace(/[^\d]/g, '') })}
                  className="w-full bg-[#08080b] border border-amber-500/40 rounded-xl p-2.5 text-amber-300 font-bold"
                />
              </div>
              <div>
                <label className="text-zinc-400 block mb-1">Fecha de Corte</label>
                <input
                  type="date"
                  value={form.renewalDate}
                  onChange={(e) => {
                    const val = e.target.value;
                    const dayNum = val ? Number(val.split('-')[2]) : form.billingDay;
                    setForm({ ...form, renewalDate: val, billingDay: dayNum });
                  }}
                  className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-2.5 text-white"
                />
              </div>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-zinc-900 text-zinc-400 cursor-pointer">Cancelar</button>
              <button type="submit" className="px-5 py-2 rounded-xl font-bold bg-amber-500 text-black cursor-pointer">Guardar Cuenta</button>
            </div>
          </form>
        </div>
      );
    }

    function BulkMotherModal({ defaultPlatform, existingMothers, onClose, onAddBulk }) {
      const [platform, setPlatform] = useState(defaultPlatform || 'NETFLIX');
      const [costPerAccount, setCostPerAccount] = useState('');
      const [rawText, setRawText] = useState('');

      const handleProcess = (e) => {
        e.preventDefault();
        const platObj = PLATFORMS.find(p => p.id === platform) || PLATFORMS[1];
        const known = new Set((existingMothers || []).map(m => m.email.trim().toLowerCase()));
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const created = [];
        const skipped = [];
        const stamp = Date.now();
        const day = new Date().getDate();
        lines.forEach((line, idx) => {
          // Formatos aceptados: correo:clave  correo;clave  correo|clave  correo,clave  correo clave
          const match = line.match(/^([^\s:;|,]+@[^\s:;|,]+)(?:\s*[:;|,]\s*|\s+)?(.*)$/);
          if (!match) { skipped.push(`${line} (sin correo válido)`); return; }
          const email = match[1].trim();
          const lower = email.toLowerCase();
          if (known.has(lower)) { skipped.push(`${email} (ya existe)`); return; }
          known.add(lower);
          created.push({
            id: 'm_bulk_' + stamp + '_' + idx,
            platform,
            email,
            password: (match[2] || '').trim(),
            maxProfiles: platObj.maxProfiles,
            cost: costPerAccount.replace(/\D/g, ''),
            billingDay: day,
            renewalDate: getNextMonthSameDay(todayISO(), day),
            createdAt: stamp
          });
        });
        if (skipped.length) alert(`Se omitieron ${skipped.length} renglón(es):\n` + skipped.slice(0, 15).join('\n'));
        if (created.length > 0) onAddBulk(created);
        else if (!skipped.length) alert('Pega al menos una cuenta (correo:clave).');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={handleProcess} className="bg-[#101015] border border-amber-500/40 rounded-2xl max-w-lg w-full p-6 space-y-4 text-xs">
            <h3 className="font-extrabold text-lg text-amber-400">⚡ Pegar Varias Cuentas de una vez</h3>
            <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
              {PLATFORMS.filter(p => p.id !== 'ALL').map(p => (
                <button
                  type="button"
                  key={p.id}
                  onClick={() => setPlatform(p.id)}
                  className={`flex flex-col items-center gap-1 p-2 rounded-xl border text-[11px] font-bold cursor-pointer ${
                    platform === p.id ? 'bg-amber-500/20 border-amber-400 text-white' : 'bg-[#09090d] border-zinc-800 text-zinc-400'
                  }`}
                >
                  <PlatformLogo platformId={p.id} size={24} />
                  <span className="truncate w-full text-center">{p.name}</span>
                </button>
              ))}
            </div>
            <div>
              <label className="text-amber-300 font-bold block mb-1">Costo mensual de cada una de estas cuentas ($) (Opcional)</label>
              <input
                type="text"
                placeholder="Ej. 38000"
                value={costPerAccount}
                onChange={(e) => setCostPerAccount(e.target.value)}
                className="w-full bg-[#08080b] border border-amber-500/40 rounded-xl p-2.5 text-amber-300 font-bold"
              />
            </div>
            <textarea
              rows={5}
              placeholder="Pega una cuenta por renglón (correo:clave)"
              value={rawText}
              onChange={(e) => setRawText(e.target.value)}
              className="w-full bg-[#08080b] border border-zinc-800 rounded-xl p-3 text-white font-mono"
            />
            <div className="flex justify-end gap-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-zinc-900 text-zinc-400 cursor-pointer">Cancelar</button>
              <button type="submit" className="px-5 py-2 rounded-xl font-bold bg-amber-500 text-black cursor-pointer">Cargar Cuentas</button>
            </div>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
